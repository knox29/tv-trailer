<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{border:0;width:100%;height:100%}</style>
</head>
<body>
<script>
// Trailer wrapper (player/trailer.ts). The TV app is a local file: YouTube rejects embeds
// without an http(s) referrer (error 153). This page lives on a real origin, embeds the
// player and relays the IFrame API messages between the app and YouTube.
(function () {
  var p = new URLSearchParams(location.search);
  var id = p.get('v') || '';
  p.delete('v');
  p.set('origin', location.origin);
  p.set('enablejsapi', '1');
  var f = document.createElement('iframe');
  f.allow = 'autoplay; encrypted-media';
  f.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) + '?' + p.toString();
  document.body.appendChild(f);
  window.addEventListener('message', function (e) {
    if (e.source === f.contentWindow) parent.postMessage(e.data, '*');
    else if (e.source === parent && f.contentWindow) f.contentWindow.postMessage(e.data, '*');
  });
})();
</script>
</body>
</html>
